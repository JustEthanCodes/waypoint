<!doctype html>
<html lang="en" data-theme="auto">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Waypoint — every bus, train, metro, tram and ferry on Earth, drawn as a minimalist Mini Metro-style map. Open source. Built on Transitous, GTFS and OpenStreetMap." />
    <meta name="theme-color" content="#f3eee3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121517" media="(prefers-color-scheme: dark)" />
    <link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      try {
        document.documentElement.dataset.theme = localStorage.getItem('wp-theme') || 'auto';
      } catch (e) {
        document.documentElement.dataset.theme = 'auto';
      }
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
