name: ETL — nightly GTFS refresh

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  etl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Rebuild city bundles (failed feeds keep last good data)
        run: npm run etl -- --all
        env:
          MOBILITY_DATABASE_REFRESH_TOKEN: ${{ secrets.MOBILITY_DATABASE_REFRESH_TOKEN }}
          TRAFIKLAB_KEY: ${{ secrets.TRAFIKLAB_KEY }}

      - name: Commit updated bundles
        run: |
          git config user.name "waypoint-etl[bot]"
          git config user.email "waypoint-etl[bot]@users.noreply.github.com"
          git add static/data
          git diff --cached --quiet && echo "No data changes" && exit 0
          git commit -m "chore(etl): nightly refresh"
          git push
